<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Box-Sizing */
        /* box-sizing: content-box; */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        .box {
            width: 200px;
            height: 100px;

            padding: 20px;
            border: 5px solid black;
            margin: 10px;
        }

        .card {
            width: 33.33%;
            padding: 20px;
            border: 2px solid black;
        }
    </style>
</head>

<body>
    <div class="box">
        Hello CSS
    </div>

    <div class="card">
        Card
    </div>

    <div class="card">
        Card
    </div>

    <div class="card">
        Card
    </div>

    <div class="card">
        Card
    </div>
</body>

</html>
